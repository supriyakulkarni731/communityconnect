<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Community Connect+</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--background); }
        .admin-topbar {
            background: var(--primary-dark);
            color: var(--white);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .admin-topbar h1 { font-size: 18px; font-weight: 800; }
        .admin-topbar a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; }
        .admin-topbar a:hover { color: var(--secondary); }
        .tab-nav {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 2px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            font-family: var(--font);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all var(--transition);
        }
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .record-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid var(--gray-100);
            font-size: 14px;
        }
        .record-row:last-child { border-bottom: none; }
        .record-row .rr-name { font-weight: 600; color: var(--text); min-width: 140px; }
        .record-row .rr-detail { flex: 1; color: var(--gray-600); font-size: 13px; }
        .record-row .rr-date { color: var(--gray-400); font-size: 12px; white-space: nowrap; }
        .status-select {
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--gray-200);
            font-family: var(--font);
            font-size: 12px;
            color: var(--text);
            background: var(--white);
            cursor: pointer;
        }
        .status-select:focus { outline: none; border-color: var(--primary); }
        .empty-records { color: var(--gray-400); text-align: center; padding: 24px; font-size: 14px; }
        .section-heading { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="admin-topbar">
        <h1>🛡️ Community Connect+ — Admin Dashboard</h1>
        <a href="index.html">← Back to Main Site</a>
    </div>

    <div class="admin-content" style="padding:24px 32px;">

        <div class="demo-banner">
            📋 Demo Admin Dashboard — All data is from localStorage. This is a frontend-only demo. In production, connect a secure backend with role-based authentication.
        </div>

        <!-- Summary Stats -->
        <div class="admin-stats-grid" id="adminStats"></div>

        <!-- Tab Navigation -->
        <div class="tab-nav" id="adminTabs">
            <button class="tab-btn active" data-tab="volunteers">🤝 Volunteers</button>
            <button class="tab-btn" data-tab="food">🍱 Food Donations</button>
            <button class="tab-btn" data-tab="share">📚 ShareCare</button>
            <button class="tab-btn" data-tab="help">🏡 HelpNear</button>
            <button class="tab-btn" data-tab="blood">🩸 Blood Donors</button>
            <button class="tab-btn" data-tab="elderly">👴 Elderly</button>
            <button class="tab-btn" data-tab="medicine">💊 Medicine</button>
            <button class="tab-btn" data-tab="wellbeing">💚 Well-being</button>
            <button class="tab-btn" data-tab="camps">🏕️ Camp Registrations</button>
            <button class="tab-btn" data-tab="sos">🆘 SOS Alerts</button>
            <button class="tab-btn" data-tab="orphanEdu">🎓 Orphanage</button>
            <button class="tab-btn" data-tab="points">⭐ Points</button>
        </div>

        <div id="tabContent"></div>

    </div>

    <script>
    "use strict";

    const STORAGE_KEYS = {
        volunteers: "cc_volunteers", food: "cc_food", share: "cc_share",
        help: "cc_help", blood: "cc_blood", elderly: "cc_elderly",
        medicine: "cc_medicine", wellbeing: "cc_wellbeing",
        campRegs: "cc_camp_registrations", sos: "cc_sos",
        orphanEdu: "cc_orphan_edu", orphanAct: "cc_orphan_act",
        points: "cc_points", activity: "cc_activity"
    };

    function getStore(key) {
        try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
    }
    function setStore(key, data) {
        try { localStorage.setItem(key, JSON.stringify(data)); } catch {}
    }
    function getObj(key) {
        try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
    }

    function escapeHtml(str) {
        return String(str || "")
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
        try { return new Date(iso).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }); }
        catch { return iso || "—"; }
    }

    function statusBadge(status) {
        const cls = {
            "Active": "status-available", "Open": "status-open", "Available": "status-available",
            "Pending": "status-pending", "Pending Pickup": "status-pending",
            "Volunteer Assigned": "status-assigned", "Assigned": "status-assigned",
            "In Progress": "status-progress", "Completed": "status-completed",
            "Collected": "status-collected", "Requested": "status-requested",
            "Verified": "status-verified", "Delivered": "status-delivered",
            "Alert Sent": "status-progress", "Under Review": "status-assigned"
        }[status] || "status-pending";
        return `<span class="status-badge ${cls}">${escapeHtml(status)}</span>`;
    }

    // Statuses per module
    const STATUS_OPTIONS = {
        volunteers: ["Active", "Inactive", "Suspended"],
        food:       ["Available", "Requested", "Collected", "Completed"],
        share:      ["Available", "Requested", "Reserved", "Donated"],
        help:       ["Open", "Under Review", "Volunteer Assigned", "In Progress", "Completed", "Cancelled"],
        blood:      ["Active", "Contacted", "Donated", "Inactive"],
        elderly:    ["Active", "Needs Attention", "Inactive"],
        medicine:   ["Pending", "Verified", "Assigned", "Delivered", "Cancelled"],
        wellbeing:  ["Recorded", "Flagged", "Responded"],
        campRegs:   ["Registered", "Attended", "Absent", "Cancelled"],
        sos:        ["Alert Sent", "Responded", "Resolved"],
        orphanEdu:  ["Pending", "Confirmed", "Completed"]
    };

    function renderTable(dataKey, storeKey, columns) {
        const records = getStore(storeKey);
        if (records.length === 0) {
            return '<p class="empty-records">No records yet. Data will appear here when users submit through the main platform.</p>';
        }
        const statuses = STATUS_OPTIONS[dataKey] || [];
        return `
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            ${columns.map(c => `<th>${c.label}</th>`).join("")}
                            ${statuses.length ? "<th>Status</th><th>Action</th>" : ""}
                        </tr>
                    </thead>
                    <tbody>
                        ${records.map((r, i) => `
                            <tr>
                                ${columns.map(c => `<td>${escapeHtml(c.key === "date" ? formatDate(r[c.key]) : (r[c.key] || "—"))}</td>`).join("")}
                                ${statuses.length ? `
                                    <td>${statusBadge(r.status || "Pending")}</td>
                                    <td>
                                        <select class="status-select" onchange="updateStatus('${storeKey}', ${i}, this.value)">
                                            ${statuses.map(s => `<option value="${s}" ${(r.status || "") === s ? "selected" : ""}>${s}</option>`).join("")}
                                        </select>
                                    </td>
                                ` : ""}
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
                <p style="font-size:12px;color:var(--gray-400);margin-top:12px;">${records.length} record(s) found</p>
            </div>
        `;
    }

    function updateStatus(storeKey, index, newStatus) {
        const records = getStore(storeKey);
        if (records[index]) {
            records[index].status = newStatus;
            records[index].lastUpdated = new Date().toISOString();
            setStore(storeKey, records);
            showAdminToast(`✅ Status updated to: ${newStatus}`);
            renderActiveTab();
        }
    }

    function showAdminToast(msg) {
        let toast = document.getElementById("adminToast");
        if (!toast) {
            toast = document.createElement("div");
            toast.id = "adminToast";
            toast.style.cssText = "position:fixed;bottom:24px;right:24px;background:#2E7D32;color:#fff;padding:12px 20px;border-radius:8px;font-weight:600;font-size:14px;z-index:9999;";
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = "1";
        setTimeout(() => { toast.style.opacity = "0"; }, 3000);
    }

    const TAB_CONFIGS = {
        volunteers: {
            label: "Volunteer Registrations",
            storeKey: STORAGE_KEYS.volunteers,
            dataKey: "volunteers",
            columns: [
                { label: "Name", key: "name" },
                { label: "Skills", key: "skills" },
                { label: "Availability", key: "availability" },
                { label: "Location", key: "location" },
                { label: "Date", key: "date" }
            ]
        },
        food: {
            label: "Food Donations",
            storeKey: STORAGE_KEYS.food,
            dataKey: "food",
            columns: [
                { label: "Name", key: "name" },
                { label: "Food Type", key: "foodType" },
                { label: "Quantity", key: "quantity" },
                { label: "Pickup Time", key: "pickupTime" },
                { label: "Ref Code", key: "refCode" },
                { label: "Date", key: "date" }
            ]
        },
        share: {
            label: "ShareCare Donations",
            storeKey: STORAGE_KEYS.share,
            dataKey: "share",
            columns: [
                { label: "Name", key: "name" },
                { label: "Item Type", key: "itemType" },
                { label: "Condition", key: "condition" },
                { label: "Location", key: "location" },
                { label: "Date", key: "date" }
            ]
        },
        help: {
            label: "HelpNear Requests",
            storeKey: STORAGE_KEYS.help,
            dataKey: "help",
            columns: [
                { label: "Name", key: "name" },
                { label: "Type", key: "helpType" },
                { label: "Category", key: "category" },
                { label: "Urgency", key: "urgency" },
                { label: "Location", key: "location" },
                { label: "Date", key: "date" }
            ]
        },
        blood: {
            label: "Blood Donor Registrations",
            storeKey: STORAGE_KEYS.blood,
            dataKey: "blood",
            columns: [
                { label: "Name", key: "name" },
                { label: "Blood Group", key: "bloodGroup" },
                { label: "Type", key: "type" },
                { label: "Location", key: "location" },
                { label: "Date", key: "date" }
            ]
        },
        elderly: {
            label: "Elderly Profiles",
            storeKey: STORAGE_KEYS.elderly,
            dataKey: "elderly",
            columns: [
                { label: "Name", key: "name" },
                { label: "Age", key: "age" },
                { label: "Location", key: "location" },
                { label: "Needs", key: "needs" },
                { label: "Date", key: "date" }
            ]
        },
        medicine: {
            label: "Medicine Assistance Requests",
            storeKey: STORAGE_KEYS.medicine,
            dataKey: "medicine",
            columns: [
                { label: "Name", key: "name" },
                { label: "Medicines", key: "medicines" },
                { label: "Urgency", key: "urgency" },
                { label: "Location", key: "location" },
                { label: "Date", key: "date" }
            ]
        },
        wellbeing: {
            label: "Daily Well-being Check-ins",
            storeKey: STORAGE_KEYS.wellbeing,
            dataKey: "wellbeing",
            columns: [
                { label: "Name", key: "name" },
                { label: "Response", key: "response" },
                { label: "Date", key: "date" }
            ]
        },
        camps: {
            label: "Medical Camp Registrations",
            storeKey: STORAGE_KEYS.campRegs,
            dataKey: "campRegs",
            columns: [
                { label: "Name", key: "name" },
                { label: "Camp", key: "campName" },
                { label: "Phone", key: "phone" },
                { label: "Date", key: "date" }
            ]
        },
        sos: {
            label: "SOS Alerts",
            storeKey: STORAGE_KEYS.sos,
            dataKey: "sos",
            columns: [
                { label: "Name", key: "name" },
                { label: "Location", key: "location" },
                { label: "Description", key: "description" },
                { label: "Date", key: "date" }
            ]
        },
        orphanEdu: {
            label: "Orphanage Support",
            storeKey: STORAGE_KEYS.orphanEdu,
            dataKey: "orphanEdu",
            columns: [
                { label: "Sponsor", key: "name" },
                { label: "Sponsorship Type", key: "sponsorshipType" },
                { label: "Note", key: "note" },
                { label: "Date", key: "date" }
            ]
        },
        points: {
            label: "Kindness Points",
            storeKey: STORAGE_KEYS.points,
            dataKey: "points",
            columns: []
        }
    };

    let activeTab = "volunteers";

    function renderActiveTab() {
        const content = document.getElementById("tabContent");
        const cfg = TAB_CONFIGS[activeTab];
        if (!cfg) return;
        if (activeTab === "points") {
            content.innerHTML = renderPointsTable();
        } else {
            content.innerHTML = `<h3 class="section-heading">${cfg.label}</h3>` + renderTable(cfg.dataKey, cfg.storeKey, cfg.columns);
        }
        // Re-attach status selects
    }

    function renderPointsTable() {
        const pts = getObj(STORAGE_KEYS.points);
        const users = Object.entries(pts)
            .filter(([k]) => k !== "__dup")
            .map(([, v]) => v)
            .sort((a, b) => b.total - a.total);
        if (users.length === 0) return '<p class="empty-records">No kindness points records yet.</p>';
        return `
            <h3 class="section-heading">⭐ Kindness Points Leaderboard (All Time)</h3>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead><tr><th>Rank</th><th>Name</th><th>Total Points</th><th>Activities</th></tr></thead>
                    <tbody>
                        ${users.map((u, i) => `
                            <tr>
                                <td>${i < 3 ? ["🥇","🥈","🥉"][i] : "#" + (i+1)}</td>
                                <td><strong>${escapeHtml(u.displayName)}</strong></td>
                                <td><strong style="color:var(--primary);">${u.total}</strong></td>
                                <td>${(u.history || []).length}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
                <p style="font-size:12px;color:var(--gray-400);margin-top:12px;">${users.length} participant(s)</p>
            </div>
        `;
    }

    function renderAdminStats() {
        const statsEl = document.getElementById("adminStats");
        if (!statsEl) return;
        const stats = [
            { label: "Volunteers", value: getStore(STORAGE_KEYS.volunteers).length, icon: "🤝" },
            { label: "Food Donations", value: getStore(STORAGE_KEYS.food).length, icon: "🍱" },
            { label: "Resource Shares", value: getStore(STORAGE_KEYS.share).length, icon: "📚" },
            { label: "Help Requests", value: getStore(STORAGE_KEYS.help).length, icon: "🏡" },
            { label: "Blood Donors", value: getStore(STORAGE_KEYS.blood).length, icon: "🩸" },
            { label: "Elderly Profiles", value: getStore(STORAGE_KEYS.elderly).length, icon: "👴" },
            { label: "Medicine Requests", value: getStore(STORAGE_KEYS.medicine).length, icon: "💊" },
            { label: "Check-ins", value: getStore(STORAGE_KEYS.wellbeing).length, icon: "💚" },
            { label: "Camp Registrations", value: getStore(STORAGE_KEYS.campRegs).length, icon: "🏕️" },
            { label: "SOS Alerts", value: getStore(STORAGE_KEYS.sos).length, icon: "🆘" }
        ];
        statsEl.innerHTML = stats.map(s => `
            <div class="admin-stat-card">
                <div class="dash-icon">${s.icon}</div>
                <div class="dash-num">${s.value}</div>
                <div class="dash-label">${s.label}</div>
            </div>
        `).join("");
    }

    function setupAdminTabs() {
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                activeTab = this.dataset.tab;
                renderActiveTab();
            });
        });
    }

    // Expose updateStatus globally for inline onchange
    window.updateStatus = updateStatus;

    document.addEventListener("DOMContentLoaded", function() {
        renderAdminStats();
        setupAdminTabs();
        renderActiveTab();
    });
    </script>

</body>
</html>
